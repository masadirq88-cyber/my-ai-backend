<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><title>شات</title></head>
<body style="font-family:Tahoma; padding:50px;">
    <h3>مرحباً، {{ username }}</h3>
    <a href="/logout">تسجيل خروج</a>
    <hr>
    <div>
        <p><b>أنت:</b> {{ request.form.message }}</p>
        <p><b>البوت:</b> {{ response }}</p>
    </div>
    <form method="POST">
        <input type="text" name="message" placeholder="اكتب رسالتك..." required>
        <button type="submit">إرسال</button>
    </form>
</body>
</html>
